<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squid Game UI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <!-- Background Text -->

      <div class="bg-text bg-left">GAME</div>
      <div class="bg-text bg-right">SQUID</div>

      <!-- Navbar -->

      <nav>
        <div class="logo">SQUID <span>GAME</span></div>

        <ul class="menu">
          <li>About</li>
          <li class="active">Watch now</li>
          <li>Actors</li>
          <li>Contact</li>
        </ul>

        <div class="hamburger">☰</div>
      </nav>

      <!-- Hero -->

      <section class="hero">
        <div class="left">
          <h1 class="title">
            SQUID <br />
            <span>GAME</span>
          </h1>

          <p class="desc">
            Action / Thriller / Drama Series directed by Dong-hyuk Hwang <br />
            Season 1 : 9 Episodes
          </p>

          <div class="buttons">
            <button class="btn play">▶ Play Now</button>

            <button class="btn trailer">▷ Watch Trailer</button>
          </div>
        </div>

        <div class="right">
          <img src="https://pngimg.com/d/squid_game_PNG37.png" alt="" />
        </div>
      </section>

      <!-- Social -->

      <div class="social">
        <div>𝕏</div>
        <div>◎</div>
        <div>f</div>
      </div>

      <!-- Cards -->

      <div class="cards">
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1520034475321-cbe63696469a?q=80&w=1200&auto=format&fit=crop"
          />

          <div class="play-icon">▶</div>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1517423440428-a5a00ad493e8?q=80&w=1200&auto=format&fit=crop"
          />

          <div class="play-icon">▶</div>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop"
          />

          <div class="play-icon">▶</div>
        </div>
      </div>
    </div>
  </body>
</html>
